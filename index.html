<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050609" />
  <title>Hellgate Manor</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="game-shell" aria-label="Hellgate Manor"></main>
  <canvas id="ui-canvas" aria-label="Game interface"></canvas>

  <div id="rotate-device" aria-live="polite">
    <div class="rotate-card">
      <div class="rotate-phone" aria-hidden="true"><span></span></div>
      <div class="rotate-title">ROTATE YOUR DEVICE</div>
      <div class="rotate-copy">Hellgate Manor is played in landscape.</div>
    </div>
  </div>

  <div id="loading" role="status" aria-live="polite">
    <div class="loading-embers" aria-hidden="true">
      <span style="--x:7%;--delay:-1.1s;--dur:6.8s;--drift:34px"></span>
      <span style="--x:14%;--delay:-4.2s;--dur:8.4s;--drift:-22px"></span>
      <span style="--x:21%;--delay:-2.6s;--dur:7.2s;--drift:28px"></span>
      <span style="--x:29%;--delay:-5.7s;--dur:9.1s;--drift:-36px"></span>
      <span style="--x:36%;--delay:-0.8s;--dur:6.5s;--drift:20px"></span>
      <span style="--x:43%;--delay:-3.3s;--dur:8.0s;--drift:-26px"></span>
      <span style="--x:50%;--delay:-6.0s;--dur:9.4s;--drift:32px"></span>
      <span style="--x:57%;--delay:-2.0s;--dur:7.5s;--drift:-18px"></span>
      <span style="--x:64%;--delay:-4.8s;--dur:8.8s;--drift:25px"></span>
      <span style="--x:71%;--delay:-1.7s;--dur:7.0s;--drift:-31px"></span>
      <span style="--x:78%;--delay:-5.2s;--dur:9.0s;--drift:22px"></span>
      <span style="--x:85%;--delay:-2.9s;--dur:7.8s;--drift:-24px"></span>
      <span style="--x:92%;--delay:-6.5s;--dur:9.6s;--drift:30px"></span>

      <span style="--x:4%;--delay:-7.1s;--dur:7.4s;--drift:26px"></span>
      <span style="--x:11%;--delay:-3.7s;--dur:6.6s;--drift:-18px"></span>
      <span style="--x:18%;--delay:-5.8s;--dur:8.7s;--drift:30px"></span>
      <span style="--x:25%;--delay:-2.4s;--dur:7.0s;--drift:-28px"></span>
      <span style="--x:33%;--delay:-6.4s;--dur:9.5s;--drift:22px"></span>
      <span style="--x:40%;--delay:-1.9s;--dur:6.9s;--drift:-16px"></span>
      <span style="--x:48%;--delay:-4.6s;--dur:8.1s;--drift:34px"></span>
      <span style="--x:55%;--delay:-7.2s;--dur:9.0s;--drift:-21px"></span>
      <span style="--x:62%;--delay:-2.1s;--dur:7.6s;--drift:18px"></span>
      <span style="--x:69%;--delay:-5.6s;--dur:8.3s;--drift:-32px"></span>
      <span style="--x:76%;--delay:-3.0s;--dur:7.1s;--drift:20px"></span>
      <span style="--x:83%;--delay:-6.8s;--dur:9.2s;--drift:-24px"></span>
      <span style="--x:90%;--delay:-4.1s;--dur:8.5s;--drift:29px"></span>
      <span style="--x:96%;--delay:-1.4s;--dur:6.4s;--drift:-15px"></span>
    </div>
    <div class="loading-panel">
      <div class="loading-title">HELLGATE MANOR</div>
      <img class="loading-studio-logo" src="./assets/moofstudiogame.png" alt="A Moof Studios Game" />
      <div class="loading-track"><div id="loading-progress"></div></div>
      <div id="loading-percent">0%</div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
