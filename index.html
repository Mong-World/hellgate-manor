<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050609" />
  <title>Hellgate Manor</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="game-shell" aria-label="Hellgate Manor"></main>
  <canvas id="ui-canvas" aria-label="Game interface"></canvas>

  <div id="rotate-device" aria-live="polite">
    <div class="rotate-card">
      <div class="rotate-phone" aria-hidden="true"><span></span></div>
      <div class="rotate-title">ROTATE YOUR DEVICE</div>
      <div class="rotate-copy">Hellgate Manor is played in landscape.</div>
    </div>
  </div>

  <div id="loading" role="status" aria-live="polite">
    <div class="loading-panel">
      <div class="loading-title">HELLGATE MANOR</div>
      <div class="loading-track"><div id="loading-progress"></div></div>
      <div id="loading-percent">0%</div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
